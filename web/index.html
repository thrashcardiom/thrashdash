<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThrashDash">
  <title>ThrashDash</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/dash.css">
  <link rel="stylesheet" href="/css/skins.css">
</head>
<body data-state="connecting">
  <div id="canvas"><div id="widgets"></div></div>
  <div id="top-controls" hidden>
    <button id="dash-button" type="button" title="Switch dashboard (D)" aria-haspopup="menu" aria-expanded="false">Dashboards</button>
    <button id="trips-button" type="button" title="Open the trip log and map (T)">Trips</button>
    <button id="edit-button" type="button" title="Edit this dashboard (E)">Edit</button>
    <button id="quit-button" type="button" title="Stop ThrashDash. Its windows close with it (they come back next time it starts)">Quit</button>
    <div id="dash-menu" role="menu" hidden></div>
  </div>
  <div id="alerts" role="alert" aria-live="assertive" hidden></div>
  <div id="trip-notice" role="status" aria-live="polite" title="Click to dismiss" hidden></div>
  <div id="zoom-toast" role="status" aria-live="polite"></div>
  <div id="overlay" role="status" aria-live="polite">
    <div id="overlay-title"></div>
    <div id="overlay-detail"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
